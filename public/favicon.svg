<svg xmlns="http://www.w3.org/2000/svg" viewBox="9 9 46 46">
  <!-- the black hole as a telescope sees it: a glowing ring, brighter on the side whose gas comes toward us, round a black shadow -->
  <defs>
    <linearGradient id="beam" x1="0.2" y1="1" x2="0.8" y2="0">
      <stop offset="0" stop-color="#ffcf8a" />
      <stop offset="0.35" stop-color="#ffb15a" />
      <stop offset="1" stop-color="#d4651f" />
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="0.7" /></filter>
  </defs>
  <circle cx="32" cy="32" r="17" fill="none" stroke="url(#beam)" stroke-width="10" filter="url(#soft)" />
  <circle cx="32" cy="32" r="11.5" fill="#000" />
</svg>
